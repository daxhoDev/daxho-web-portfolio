<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="daxho">
  <!--
    Favicon derivado de la marca reducida (12-brand.md).

    A 16x16 la palabra "daxho" es ilegible, así que se conserva lo que SÍ
    identifica la marca y sobrevive al tamaño: el prompt ">" y el cursor de
    bloque "▮". Es el mismo par que ancla la marca, el hero y la boot sequence.

    Cambia con el tema: un rojo fijo se pierde en una de las dos barras de
    pestañas. Se usan los mismos tokens que el sitio -- blood-800 en claro,
    blood-400 en oscuro -- escritos como literales porque un SVG servido desde
    /public no ve las variables CSS del documento.
  -->
  <style>
    :root { --mark: #8a0303; }
    @media (prefers-color-scheme: dark) { :root { --mark: #f04747; } }
  </style>
  <path
    d="M10 16 L28 32 L10 48"
    fill="none"
    stroke="var(--mark, #8a0303)"
    stroke-width="8"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <rect x="38" y="18" width="16" height="28" fill="var(--mark, #8a0303)" />
</svg>
